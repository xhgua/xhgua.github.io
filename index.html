<!-- clipboard -->

<script type="text/javascript">
  // Re-runnable: mounts copy buttons onto code blocks and (re)binds ClipboardJS.
  // Defined unconditionally so it survives a Swup navigation into a post page.
  window.initClipboard = function() {
    if (!$(".highlight table").length) return;
    // copy-btn HTML
    var btn = "<span class=\"btn-copy tooltipped tooltipped-sw\" aria-label=\"复制到粘贴板！\">";
    btn += '<i class="fa-regular fa-clone"></i>';
    btn += '</span>';
    // mount it (skip blocks that already have a button)
    $(".highlight table").each(function() {
      if (!$(this).prev(".btn-copy").length) {
        $(this).before(btn);
      }
    });
    // destroy the previous instance so delegated handlers never stack
    if (window._clip) { window._clip.destroy(); }
    var clip = new ClipboardJS('.btn-copy', {
      text: function(trigger) {
        return Array.from(trigger.nextElementSibling.querySelectorAll('.code')).reduce((str,it)=>str+it.innerText+'\n','')
      }
    });
    clip.on('success', function(e) {
      e.trigger.setAttribute('aria-label', "复制成功！");
      e.clearSelection();
    })
    window._clip = clip;
  };
  $(function() { window.initClipboard(); });
</script>

<!-- Nested collapsible ToC: an item owning a sub-list becomes a foldable header -->
<script type="text/javascript">
  // Re-runnable: (re)marks TOC items that own a child list. The delegated
  // click handler is bound once on document, so it survives Swup DOM swaps.
  window.initToc = function() {
    $(".toc-item").each(function() {
      if ($(this).children(".toc-child").length) {
        $(this).addClass("has-child");
      }
    });
  };
  $(document).off("click.toc").on("click.toc", ".toc-item.has-child > .toc-link", function(e) {
    e.preventDefault();
    $(this).parent().toggleClass("is-open");
  });
  $(function() { window.initToc(); });
</script>
